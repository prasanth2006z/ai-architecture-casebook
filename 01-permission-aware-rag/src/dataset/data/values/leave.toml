# Value tables for the leave and parental-leave topics. SYNTHETIC DATA.
#
# Format: [topic] holds topic-level values shared by both countries (title, version,
# effective_date, condition_section). [topic.uk] and [topic.in] hold the country values.
# A value written as { "G1-6" = a, "G7+" = b } is flattened to <key>_g1_6 and <key>_g7_plus.

[annual-leave]
title = "Annual Leave Policy"
area = "leave"
version = "1.0"
effective_date = "2026-01-01"
condition_section = "3.2"

[annual-leave.uk]
policy_code = "HR-LV-UK-001"
days = { "G1-6" = 25, "G7+" = 28 }
holidays = 8
min_service_months = 3
notice_days = 14
response_days = 3
carry_over_days = 5
carry_over_deadline = "31 March"

[annual-leave.in]
policy_code = "HR-LV-IN-001"
days = { "G1-6" = 24, "G7+" = 27 }
holidays = 10
min_service_months = 6
notice_days = 7
response_days = 2
carry_over_days = 10
carry_over_deadline = "30 June"

[sick-leave]
title = "Sick Leave Policy"
area = "leave"
version = "1.0"
effective_date = "2026-01-01"

[sick-leave.uk]
policy_code = "HR-LV-UK-002"
sick_days = 10
report_by = "10:00 on the first day of absence"
cert_days = 7
full_pay_days = 5

[sick-leave.in]
policy_code = "HR-LV-IN-002"
sick_days = 12
report_by = "09:30 on the first day of absence"
cert_days = 3
full_pay_days = 12

