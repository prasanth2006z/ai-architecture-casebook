[project]
name = "hr-dataset"
version = "0.1.0"
description = "Deterministic generator for the synthetic HR policy dataset (case study 01)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hr-dataset = "hr_dataset.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "evals",
    "pytest",
    "ruff",
]

[tool.uv.sources]
evals = { path = "../../../shared/evals", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ANN enforces type hints on all functions (constitution Principle VII).
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
