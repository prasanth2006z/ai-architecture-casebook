[project]
name = "evals"
version = "0.1.0"
description = "Shared evaluation harness for the AI Architecture Casebook"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
evals = "evals.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ANN enforces type hints on all functions (constitution Principle VII).
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
